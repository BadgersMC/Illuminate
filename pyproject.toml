[project]
name = "illuminate-panda"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2,<3",
  "panda3d==1.10.16",
  "Pillow>=11,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
illuminate-mcp = "illuminate.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/illuminate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

